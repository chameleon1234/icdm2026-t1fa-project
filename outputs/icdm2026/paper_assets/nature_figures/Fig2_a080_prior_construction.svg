   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start" x="26.451" y="32.64696" transform="rotate(-0 26.451 32.64696)">A080 frequency-aware sharp FA prior construction</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(55.604203 80.2775)">Stable low-frequency</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(73.945219 88.298047)">FA source</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(79.576664 96.34039)">(Base)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(48.933891 167.92814)">FA-space high-frequency</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(69.360258 175.948687)">detail source</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(78.536625 183.99103)">(Detail)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(231.911938 84.426476)">LP / HP split</text>
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(207.952797 91.932664)">base_hp = Base - LP(Base)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(231.911938 172.077116)">LP / HP split</text>
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(205.233734 179.583304)">detail_hp = Detail - LP(Detail)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(398.236047 128.656191)">clipped delta</text>
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(379.754953 136.162378)">clip(detail_hp - base_hp,</text>
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(399.989875 143.750597)">-0.06, 0.06)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(559.85925 129.45661)">A080 prior</text>
    <text style="font-size: 8px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(546.624875 137.91811)">Base + 0.8 * delta</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(290.142563 232.07517)">base_hp = Base - LP(Base)</text>
    <text style="font-size: 7.2px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(287.345813 239.880195)">detail_hp = Detail - LP(Detail)</text>
    <text style="font-size: 7.2px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(257.920313 247.68522)">delta_hp = clip(detail_hp - base_hp, -0.06, 0.06)</text>
    <text style="font-size: 7.2px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(287.431875 255.490245)">A080 = Base + 0.8 * delta_hp</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(533.984063 235.881504)">alpha = 0.8</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(536.07293 243.814161)">kernel = 9</text>
    <text style="font-size: 7.5px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; fill: #222222" transform="translate(525.230156 251.773536)">clip_delta = 0.06</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start; fill: #767676" x="32.868" y="230.56776" transform="rotate(-0 32.868 230.56776)">Base preserves stable FA low-frequency structure and intensity space.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start; fill: #767676" x="32.868" y="244.70496" transform="rotate(-0 32.868 244.70496)">Detail provides FA-space texture candidates; clipping suppresses local over-bright bursts.</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7px; font-family: 'Arial', 'DejaVu Sans', 'Liberation Sans', sans-serif; text-anchor: start; fill: #767676" x="32.868" y="258.84216" transform="rotate(-0 32.868 258.84216)">A080 is a frozen frequency-aware prior, not an online trainable Stage1 checkpoint.</text>
   </g>
